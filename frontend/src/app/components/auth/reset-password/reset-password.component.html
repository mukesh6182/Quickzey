<app-header></app-header>

<!-- Toast -->
<div *ngIf="toastMessage" class="modern-toast-wrapper">
  <div class="modern-toast-card shadow-lg" [ngClass]="toastType">
    <div class="toast-accent"></div>

    <div class="toast-content">
      <div class="toast-icon">
        <i *ngIf="toastType === 'success'" class="fas fa-check-circle"></i>
        <i *ngIf="toastType === 'danger'" class="fas fa-exclamation-circle"></i>
      </div>

      <div class="toast-body-text">
        <strong class="toast-status text-uppercase">
          {{ toastType === 'success' ? 'Success' : 'Attention' }}
        </strong>
        <p class="toast-msg-content">{{ toastMessage }}</p>
      </div>

      <button type="button" class="btn-toast-close" (click)="toastMessage=null">
        <i class="fas fa-times"></i>
      </button>
    </div>
  </div>
</div>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="form-card p-4">
    <h4 class="text-center mb-3">Reset Password</h4>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-floating mb-3">
        <input type="password" class="form-control" placeholder="New Password" formControlName="newPassword">
        <label>New Password</label>
        <div *ngIf="form.get('newPassword')?.invalid && form.get('newPassword')?.touched" class="text-danger small mt-1">
          Password must be at least 6 characters.
        </div>
      </div>

      <div class="form-floating mb-4">
        <input type="password" class="form-control" placeholder="Confirm Password" formControlName="confirmPassword">
        <label>Confirm Password</label>
        <div *ngIf="form.get('confirmPassword')?.invalid && form.get('confirmPassword')?.touched" class="text-danger small mt-1">
          Confirm password is required.
        </div>
      </div>

      <button class="btn btn-primary w-100" [disabled]="form.invalid || isSubmitting">
        Reset Password
      </button>
    </form>
  </div>
</div>
