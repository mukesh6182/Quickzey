<app-header></app-header>

<div *ngIf="toastMessage" class="modern-toast-wrapper">
  <div class="modern-toast-card" [ngClass]="toastType">
    <div class="toast-accent"></div>
    <div class="toast-content">
      <p class="toast-msg-content">{{ toastMessage }}</p>
    </div>
  </div>
</div>

<div class="otp-container container">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-4 shadow">
        <h3 class="text-center">Verify OTP</h3>
        <p class="text-muted text-center">
          Enter OTP sent to <strong>{{ email }}</strong>
        </p>

        <form [formGroup]="otpForm" (ngSubmit)="verifyOtp()">
          <div class="form-floating mb-3">
            <input type="text" class="form-control" formControlName="otp" placeholder="OTP">
            <label>OTP</label>
          </div>

          <button class="btn btn-primary w-100" [disabled]="otpForm.invalid || isSubmitting">
            Verify OTP
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
