<app-header></app-header>

<!-- Toast -->
<div *ngIf="toastMessage" class="modern-toast-wrapper">
  <div class="modern-toast-card" [ngClass]="toastType">
    <div class="toast-accent"></div>
    <div class="toast-content">
      <div class="toast-icon">
        <i *ngIf="toastType==='success'" class="fas fa-check-circle"></i>
        <i *ngIf="toastType==='danger'" class="fas fa-exclamation-circle"></i>
      </div>
      <div class="toast-body-text">
        <strong class="toast-status">{{ toastType === 'success' ? 'Success' : 'Attention' }}</strong>
        <p class="toast-msg-content">{{ toastMessage }}</p>
      </div>
      <button class="btn-toast-close" (click)="toastMessage=null">
        <i class="fas fa-times"></i>
      </button>
    </div>
  </div>
</div>

<div class="register-container container-fluid p-0">
  <div class="row g-0 align-items-stretch">

    <!-- Left Image -->
    <div class="col-md-6 d-none d-md-block position-relative">
      <div class="image-wrapper">
        <img src="/assets/images/register.png" alt="Forgot Password">
      </div>
    </div>

    <!-- Form -->
    <div class="col-12 col-md-6">
      <div class="register-form-wrapper d-flex justify-content-center align-items-center h-100">
        <div class="form-card p-4 p-lg-5">
          <h2 class="fw-bold mb-2">Forgot Password</h2>
          <p class="text-muted mb-4">Enter your email to receive an OTP.</p>

          <form [formGroup]="forgotForm" (ngSubmit)="sendOtp()">
            <div class="form-floating mb-4">
              <input type="email" class="form-control" placeholder="Email" formControlName="email">
              <label>Email Address</label>
              <div *ngIf="isInvalid('email')" class="text-danger small mt-1">
                Valid email is required.
              </div>
            </div>

            <button class="btn btn-primary w-100 btn-lg" [disabled]="forgotForm.invalid || isSubmitting">
              Send OTP
            </button>
          </form>

          <p class="text-center mt-3">
            <a routerLink="/login" class="fw-bold text-primary">Back to Login</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
