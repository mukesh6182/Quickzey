<div *ngIf="toastMessage" class="toast-wrapper">
  <div class="toast-card" [ngClass]="toastType">
    <div class="toast-accent"></div>
    <div class="toast-content-wrapper">
      <div class="toast-icon">
        <i *ngIf="toastType === 'success'" class="fas fa-check-circle"></i>
        <i *ngIf="toastType === 'danger'" class="fas fa-exclamation-circle"></i>
      </div>
      <div class="toast-text">
        <span class="toast-title">{{ toastType === 'success' ? 'Success' : 'Notice' }}</span>
        <p class="toast-message">{{ toastMessage }}</p>
      </div>
      <button class="toast-close" (click)="toastMessage=null">
        <i class="fas fa-times"></i>
      </button>
    </div>
  </div>
</div>

<aside class="sidebar" [class.collapsed]="isCollapsed" [class.open]="isMobileOpen">
  <div class="logo" routerLink="/delivery">
    <i class="fa fa-motorcycle"></i> <span>Quickzey</span>
  </div>

  <ul class="nav-list">
    <li class="menu-item">
      <a routerLink="/delivery/deliveries" routerLinkActive="active-link" class="nav-link">
        <i class="fa fa-truck-loading"></i>
        <span class="link-text">My Deliveries</span>
      </a>
    </li>

    <li class="menu-item logout-item">
      <a (click)="logout()" class="nav-link">
        <i class="fas fa-sign-out-alt"></i>
        <span class="link-text">Logout</span>
      </a>
    </li>
  </ul>
</aside>
