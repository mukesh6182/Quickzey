<div class="container mt-5">
  <h2 class="text-center mb-4">Add Product</h2>

  <form [formGroup]="productForm" (ngSubmit)="submitProduct()">

    <!-- Product Name -->
    <div class="mb-3">
      <label class="form-label">Product Name</label>
      <input class="form-control" formControlName="name">
    </div>

    <!-- Category -->
    <div class="mb-3">
      <label class="form-label">Category</label>
      <select class="form-control" formControlName="category" (change)="getSubCategoriesByCategory()">
        <option value="">Select Category</option>
        <option *ngFor="let c of categories" [value]="c._id">
          {{ c.name }}
        </option>
      </select>
    </div>

    <!-- SubCategory -->
    <div class="mb-3">
      <label class="form-label">Sub Category</label>
      <select class="form-control" formControlName="subCategory">
        <option value="">Select SubCategory</option>
        <option *ngFor="let sc of getSubCategoriesByCategory()" [value]="sc._id">
          {{ sc.name }}
        </option>
      </select>
    </div>

    <!-- Price -->
    <div class="mb-3">
      <label class="form-label">Price</label>
      <input type="number" class="form-control" formControlName="price">
    </div>

    <!-- Description -->
    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea class="form-control" rows="3" formControlName="description"></textarea>
    </div>

    <!-- Images -->
    <div class="mb-3">
      <label class="form-label">Product Images (2–5)</label>
      <input
        type="file"
        class="form-control"
        multiple
        accept="image/*"
        (change)="onImagesSelected($event)"
      >
      <small class="text-danger" *ngIf="imageError">{{ imageError }}</small>
    </div>

    <!-- Submit -->
    <button class="btn btn-primary w-100" type="submit">
      Add Product
    </button>

  </form>
</div>
