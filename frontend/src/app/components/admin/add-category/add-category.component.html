<!-- Toast Message -->
<div *ngIf="toastMessage" class="modern-toast-wrapper">
  <div class="modern-toast-card" [ngClass]="toastType">
    <div class="toast-accent"></div>
    <div class="toast-content">
      <div class="toast-icon">
        <i *ngIf="toastType === 'success'" class="fas fa-check-circle"></i>
        <i *ngIf="toastType === 'danger'" class="fas fa-exclamation-circle"></i>
      </div>
      <div class="toast-body-text">
        <strong class="toast-status">
          {{ toastType === 'success' ? 'Success' : 'Error' }}
        </strong>
        <p class="toast-msg-content">{{ toastMessage }}</p>
      </div>
      <button class="btn-toast-close" (click)="toastMessage=null">
        <i class="fas fa-times"></i>
      </button>
    </div>
  </div>
</div>

<!-- Centered Form -->
<div class="page-wrapper">
  <div class="form-card">
    <h2 class="fw-bold mb-2">Add New Category</h2>
    <p class="text-muted mb-4">Fill in the category details below</p>

    <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()">
      <!-- Category Name -->
      <div class="form-floating mb-3">
        <input class="form-control" placeholder="Category Name"
               formControlName="name" [class.is-invalid]="isInvalid('name')">
        <label for="categoryName">Category Name</label>
        <div *ngIf="isInvalid('name')" class="text-danger small mt-1">
          <span *ngIf="categoryForm.get('name')?.errors?.['required']">Category name is required.</span>
          <span *ngIf="categoryForm.get('name')?.errors?.['minlength']">Category name must be at least 3 characters.</span>
        </div>
      </div>

      <!-- Category Image -->
      <div class="form-floating mb-3">
        <input type="file" class="form-control" (change)="onFileChange($event)"
               [class.is-invalid]="isInvalid('image')" accept="image/*">
        <label for="categoryImage">Category Image</label>
        <div *ngIf="isInvalid('image')" class="text-danger small mt-1">
          Image is required.
        </div>
      </div>

      <!-- Category Order -->
      <div class="form-floating mb-3">
        <input class="form-control" placeholder="Category Order | Optional | Default 0"
               formControlName="order" [class.is-invalid]="isInvalid('order')">
        <label for="categoryOrder">Category Order</label>
        <div *ngIf="isInvalid('order')" class="text-danger small mt-1">
          Order is required.
        </div>
      </div>

      <!-- Submit Button -->
      <button class="btn btn-primary w-100 btn-lg" [disabled]="categoryForm.invalid || isSubmitting">
        {{ isSubmitting ? 'Adding Category...' : 'Add Category' }}
      </button>
    </form>
  </div>
</div>
