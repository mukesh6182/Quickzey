<div class="container my-5">
  <h2 class="text-center mb-5">Store Products</h2>

  <!-- Dropdowns -->
  <div class="row mb-4 justify-content-center">
    <div class="col-md-4 mb-2">
      <select class="form-select shadow-sm" [(ngModel)]="selectedCategory" (change)="onCategoryChange()">
        <option value="">Select Category</option>
        <option *ngFor="let cat of categories" [value]="cat._id">{{ cat.name }}</option>
      </select>
    </div>

    <div class="col-md-4 mb-2">
      <select
        class="form-select shadow-sm"
        [(ngModel)]="selectedSubCategory"
        (change)="onSubCategoryChange()"
        [disabled]="subcategories.length === 0"
      >
        <option value="">Select Subcategory</option>
        <option *ngFor="let sub of subcategories" [value]="sub._id">{{ sub.name }}</option>
      </select>
    </div>
  </div>

  <!-- Message -->
  <div *ngIf="products.length === 0 && !loading" class="text-center text-muted my-5">
    <h5>{{ message }}</h5>
  </div>

  <!-- Loading spinner -->
  <div *ngIf="loading" class="text-center my-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- Product Grid -->
  <div class="row g-4 justify-content-center">
    <div *ngFor="let product of products" class="col-md-4 col-lg-3 d-flex justify-content-center">
      <div class="card product-card shadow-lg position-relative">

        <!-- + button on top-left -->
        <button class="add-stock-btn" (click)="openAddModal(product)">+</button>

        <!-- Image slider -->
        <div class="position-relative slider-container">
          <img [src]="getCurrentImage(product)" class="card-img-top product-image" alt="{{ product.name }}" />
          <button class="slider-btn prev-btn" (click)="prevImage(product)">&#10094;</button>
          <button class="slider-btn next-btn" (click)="nextImage(product)">&#10095;</button>
        </div>

        <div class="card-body d-flex flex-column align-items-center">
          <h5 class="card-title text-center">{{ product.name }}</h5>
          <p class="price">₹{{ product.price | number:'1.0-0' }}</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap Modal -->
<div class="modal fade" [ngClass]="{'show d-block': showModal}" tabindex="-1" style="background: rgba(0,0,0,0.5);" *ngIf="showModal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add {{ selectedProduct?.name }} to Store</h5>
        <button type="button" class="btn-close" (click)="closeModal()"></button>
      </div>
      <div class="modal-body text-center">
        <div class="d-flex justify-content-center align-items-center mb-3">
          <button class="btn btn-outline-secondary me-2" (click)="decrementQuantity()">-</button>
          <input type="number" class="form-control text-center" style="width:80px;" [(ngModel)]="quantity" min="1" />
          <button class="btn btn-outline-secondary ms-2" (click)="incrementQuantity()">+</button>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancel</button>
        <button type="button" class="btn btn-primary" (click)="submitStoreProduct()">Add to Store</button>
      </div>
    </div>
  </div>
</div>
